<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top 5 Hacker News Stories</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f6f6ef;
    color: #222;
  }
  h1 {
    font-size: 22px;
    border-bottom: 2px solid #ff6600;
    padding-bottom: 8px;
  }
  ol {
    padding-left: 20px;
  }
  li {
    margin-bottom: 16px;
  }
  a.title {
    color: #222;
    font-weight: bold;
    text-decoration: none;
  }
  a.title:hover {
    text-decoration: underline;
  }
  .meta {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
  }
  .meta a {
    color: #666;
  }
  .industry {
    display: inline-block;
    font-size: 12px;
    font-weight: bold;
    color: #ff6600;
    background: #fff2e8;
    border: 1px solid #ffd9b3;
    border-radius: 3px;
    padding: 1px 6px;
    margin-left: 6px;
  }
  .summary {
    font-size: 14px;
    color: #333;
    margin-top: 6px;
    line-height: 1.4;
    padding-left: 10px;
    border-left: 3px solid #ff6600;
  }
  #status {
    color: #666;
  }
</style>
</head>
<body>
  <h1>Top 5 Hacker News Stories</h1>
  <p id="status">Loading stories and generating summaries...</p>
  <ol id="stories"></ol>

  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadTopStories() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("stories");

      try {
        const response = await fetch("/api/stories");
        if (!response.ok) {
          throw new Error((await response.json()).error || response.statusText);
        }
        const stories = await response.json();

        listEl.innerHTML = stories.map(story => `
          <li>
            <a class="title" href="${escapeHtml(story.url)}" target="_blank" rel="noopener">
              ${escapeHtml(story.title)}
            </a>
            <div class="meta">
              ${story.score} points by ${escapeHtml(story.by)} ·
              <a href="https://news.ycombinator.com/item?id=${story.id}" target="_blank" rel="noopener">
                ${story.descendants} comments
              </a>
              <span class="industry">${escapeHtml(story.industry)}</span>
            </div>
            <div class="summary">${escapeHtml(story.summary)}</div>
          </li>
        `).join("");

        statusEl.remove();
      } catch (err) {
        statusEl.textContent = "Failed to load stories: " + err.message;
      }
    }

    loadTopStories();
  </script>
</body>
</html>
